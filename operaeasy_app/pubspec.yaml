name: operaeasy_app
description: "OperaEasy - Field Service Management App"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod: ^2.4.0

  # HTTP & API
  dio: ^5.4.0

  # Database & Local Storage (será adicionado pra mobile depois)
  # drift: ^2.14.0
  # sqlite3_flutter_libs: ^0.5.24

  # Firebase (será adicionado após FCM configurado)
  # firebase_core: ^2.24.0
  # firebase_messaging: ^14.7.0

  # Camera & Images
  image_picker: ^1.1.2

  # Models & Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # SVG Support
  flutter_svg: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  drift_dev: ^2.14.0
  freezed: ^2.4.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/
